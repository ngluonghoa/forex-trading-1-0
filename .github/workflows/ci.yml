name: M1 synthetic domain CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  python-unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Explicit immutable commits verified against official actions/* refs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned synthetic security dependency
        run: python -m pip install --disable-pip-version-check -r requirements-security-synthetic.txt
      - name: Bytecode compile
        run: python -m compileall -q src tests
      - name: Synthetic unit and negative tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
