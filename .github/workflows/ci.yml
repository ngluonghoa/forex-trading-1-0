name: Forex contract CI and artifact smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  python-unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Explicit immutable commits verified against official actions/* refs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # full local refs for historical scanner
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bytecode compile
        run: python -m compileall -q src tests
      - name: Synthetic unit and negative tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Install pinned Ruff and mypy static analyzers
        run: python -m pip install ruff==0.13.0 mypy==1.18.2
      - name: Reject critical Python syntax and undefined-name issues
        run: ruff check --select E9,F63,F7,F82 src tests tools
      - name: Reject broad syntax and indentation issues
        run: ruff check --select E4,E7 src tests tools
      - name: Full Pyflakes on typed contract baseline
        run: |
          ruff check --select F \
            src/forex_trading/model.py \
            src/forex_trading/pipeline.py \
            src/forex_trading/scan_contract.py \
            src/forex_trading/versioning.py \
            src/forex_trading/release_readiness.py
      - name: Strict static typing for typed contract baseline
        run: |
          python -m mypy --strict --python-version 3.11 --show-error-codes --no-incremental \
            src/forex_trading/model.py \
            src/forex_trading/pipeline.py \
            src/forex_trading/scan_contract.py \
            src/forex_trading/versioning.py \
            src/forex_trading/release_readiness.py
      - name: Install pinned RE4c security audit tools (CI only)
        run: python -m pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Scan tracked repository text for high-confidence credential signatures
        run: python tools/check_repo_secrets.py
      - name: Block high-confidence credentials in reachable Git history
        run: python -m tools.check_git_history_secrets
      - name: Audit Python source and tooling for medium/high security findings
        run: bandit -r src tools --severity-level medium --confidence-level medium
      - name: Check declared project dependencies against live vulnerability advisories
        run: pip-audit --progress-spinner off .
      - name: Audit resolved PEP 517 build requirement range (not an exact build lock)
        run: |
          python tools/write_build_audit_requirements.py .ci-build-requirements.txt
          pip-audit --progress-spinner off --requirement .ci-build-requirements.txt
      - name: Validate current CI Python environment
        run: python -m pip check
      - name: Build wheel twice with a fixed source timestamp (NOT a release)
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m pip wheel --no-cache-dir --no-deps --wheel-dir .ci-wheel .
          python -m pip wheel --no-cache-dir --no-deps --wheel-dir .ci-wheel-repeat .
      - name: Verify source metadata and same-environment wheel hash parity
        run: python tools/verify_build_artifact.py .ci-wheel --repeat-wheel-dir .ci-wheel-repeat
      - name: Upload one verified CI wheel for RE5a cross-Python comparison (NOT release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 pinned
        with:
          name: forex-re5a-wheel-${{ matrix.python-version }}
          path: .ci-wheel/*.whl
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  cross-python-wheel-parity:
    name: Cross-Python wheel parity (3.11 / 3.12)
    needs: python-unittest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Download Python 3.11 wheel from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 pinned
        with:
          name: forex-re5a-wheel-3.11
          path: .ci-cross-python/py311
      - name: Download Python 3.12 wheel from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 pinned
        with:
          name: forex-re5a-wheel-3.12
          path: .ci-cross-python/py312
      - name: Verify two Python builds are byte-identical and match exact checked-out source
        run: python -m tools.check_cross_python_artifacts .ci-cross-python/py311 .ci-cross-python/py312
